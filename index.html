<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live leaderboard · Anchored In Archery</title>
<meta name="description" content="Live tournament scores from Anchored In Archery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F6F4EF;--card:#FFFFFF;--ink:#16181D;--quiet:#5A5D64;--line:#E4DED2;--gold:#D4A017;--silver:#8E979F;--bronze:#B4703A;--accent:#1F5FAE;--warn:#B45309}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1114;--card:#1A1D22;--ink:#F2F2EF;--quiet:#A6AAB2;--line:#2C3037;--accent:#6EA8FF;--warn:#F2B35C}}
:root[data-theme="dark"]{--bg:#0F1114;--card:#1A1D22;--ink:#F2F2EF;--quiet:#A6AAB2;--line:#2C3037;--accent:#6EA8FF;--warn:#F2B35C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(28px,4vw,64px);line-height:1;letter-spacing:.5px;text-transform:uppercase}
.sub{color:var(--quiet);font-size:clamp(14px,1.4vw,22px);margin-top:6px}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(13px,1.2vw,20px);color:var(--quiet)}
.dot{width:12px;height:12px;border-radius:50%;background:#2E9E5B;animation:p 1.6s ease-in-out infinite}
.final .dot{background:var(--gold);animation:none}
@keyframes p{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.div h2{margin:0 0 8px;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:clamp(18px,1.8vw,30px)}
table{width:100%;border-collapse:collapse;font-size:clamp(15px,1.5vw,26px)}
th{text-align:left;font-size:.6em;letter-spacing:1px;text-transform:uppercase;color:var(--quiet);font-weight:700;padding:4px 6px}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.r{text-align:right;font-variant-numeric:tabular-nums}
.place{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:50%;font-weight:800;font-size:.9em}
.p1{background:var(--gold);color:#1b1b1b}.p2{background:var(--silver);color:#fff}.p3{background:var(--bronze);color:#fff}
.name{font-weight:700}
.meta{color:var(--quiet);font-size:.62em;font-weight:500}
.score{font-family:Oswald,sans-serif;font-weight:700;font-size:1.25em}
.tie{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:.55em;font-weight:700;color:var(--warn);border:1px solid var(--warn)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;font-size:18px;color:var(--quiet)}
footer{margin-top:22px;color:var(--quiet);font-size:clamp(12px,1vw,16px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
a{color:var(--accent)}
.tv .wrap{max-width:none;padding:28px 36px}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(16px,4vw,64px);background:#fff;border-radius:18px;padding:clamp(10px,1.4vw,22px) 20px;margin-bottom:18px;border:1px solid var(--line)}
.brand[hidden]{display:none}
.brand img{display:block;height:clamp(44px,7vw,120px);width:auto;max-width:100%}
.brand img.wide{height:clamp(30px,4.6vw,78px)}
.ends{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.28em;font-size:.6em}
tr.er td{border-top:0;padding-top:2px;padding-bottom:16px}
tr.er .ends{background:rgba(127,127,127,.09);border-radius:.9em;padding:.7em .9em;margin-top:.5em}
table.tri th.sg,table.tri td.sg{border-left:2px solid var(--line);padding-left:.7em;padding-right:.7em;text-align:center;min-width:4.6em}
table.tri th.sg{font-size:.68em;color:inherit}
table.tri th.tt,table.tri td.tt{border-left:3px solid var(--gold);background:rgba(127,127,127,.09);padding-left:.7em;padding-right:.7em;text-align:center}
table.tri td.xx,table.tri th.xx{border-left:2px solid var(--line);text-align:center;padding-left:.6em}
table.tri tr.mr td{padding-top:14px;padding-bottom:10px}
.ends .lab{color:var(--quiet);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:.3em;align-self:center}
.ebox{min-width:2.4em;text-align:center;border:1px solid var(--line);border-radius:.4em;padding:.12em .2em;line-height:1.15;font-variant-numeric:tabular-nums}
.ebox b{display:block;font-family:Oswald,sans-serif;font-size:1.15em}
.ebox i{display:block;font-style:normal;color:var(--quiet);font-size:.78em}
.ebox.todo{opacity:.35}.ebox.now{border-color:var(--gold)}
.seg{color:var(--quiet)}.seg.cur{color:var(--gold)}
/* TV with host logos: the logos sit still behind the board and liquid-glass cards scroll over them */
.backdrop{position:fixed;inset:0;z-index:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:5vh;background:radial-gradient(90% 70% at 50% 45%,#fff 0%,#F3EFE6 65%,#DDD3BD 100%)}
.backdrop img{display:block;mix-blend-mode:multiply;opacity:.85;max-width:78vw;height:auto}
.backdrop img:first-child{width:62vw}.backdrop img.wide{width:78vw}
.glass .backdrop{display:flex}
.glass .wrap{position:relative;z-index:1;transition:opacity .5s;padding-top:0}
.glass .brand{display:none}
.glass header,.glass .div,.glass footer{-webkit-backdrop-filter:blur(7px) saturate(180%) brightness(1.06);backdrop-filter:blur(7px) saturate(180%) brightness(1.06)}
.glass header{position:sticky;top:10px;z-index:3;margin:10px 0 18px;padding:16px 28px 14px;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.7));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 26px rgba(255,255,255,.3),0 14px 34px rgba(0,0,0,.2)}
.glass .grid{gap:20px}
.glass .div{position:relative;overflow:hidden;border-radius:32px;padding:20px 22px;background:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.4) 45%,rgba(255,255,255,.52) 100%);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 1.5px 0 0 rgba(255,255,255,.55),inset 0 -1.5px 0 rgba(255,255,255,.3),inset 0 0 34px rgba(255,255,255,.28),0 22px 48px rgba(0,0,0,.22)}
.glass .div::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 72%,rgba(255,255,255,.22) 100%)}
.glass .div>*{position:relative}
.glass tr.er .ends{background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.7);border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.glass .ebox{background:rgba(255,255,255,.82);border-color:rgba(0,0,0,.14);border-radius:.6em}
.glass table.tri th.tt,.glass table.tri td.tt{background:rgba(212,160,23,.2)}
.glass td,.glass table.tri th.sg,.glass table.tri td.sg,.glass table.tri td.xx,.glass table.tri th.xx{border-color:rgba(0,0,0,.2)}
.glass th,.glass .meta,.glass .sub,.glass .ends .lab,.glass .seg{color:#33363C}
.glass .seg.cur{color:#9A6B00;font-weight:700}
.glass footer{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:10px 20px}
/* TV glass: bigger, bolder and brighter so it reads from the shooting line */
.glass table{font-size:clamp(17px,1.5vw,30px)}
.glass .div h2{margin:-20px -22px 10px;padding:12px 22px;background:#111;color:#FFD400;font-size:clamp(22px,2.1vw,40px);letter-spacing:2px}
.glass th{font-size:.62em;font-weight:800;color:#111}
.glass table.tri th.sg{font-size:.7em;font-weight:800}
.glass table.tri th.sg:nth-of-type(3){color:#0B4FC4}.glass table.tri th.sg:nth-of-type(4){color:#C81E12}.glass table.tri th.sg:nth-of-type(5){color:#111}
.glass thead th{border-bottom:4px solid #111;padding-bottom:8px}
.glass table tbody tr.mr td,.glass table tbody tr:not(.er) td,.glass table.tri tbody tr.mr td.sg,.glass table.tri tbody tr.mr td.tt,.glass table.tri tbody tr.mr td.xx{border-top:4px solid #111}
.glass table tbody tr:first-child td,.glass table.tri tbody tr:first-child td.sg,.glass table.tri tbody tr:first-child td.tt,.glass table.tri tbody tr:first-child td.xx{border-top:0}
.glass tr.er td{border-top:0}
.glass .name{font-weight:800;font-size:1.08em;color:#0B0B0C;white-space:nowrap}
.glass table.tri td,.glass table.tri th{padding-left:.35em;padding-right:.35em}
.glass .meta{display:block;font-size:.58em;font-weight:700;color:#33363C}
.glass .place{width:2em;height:2em;font-size:.95em;font-weight:900;background:#111;color:#fff}
.glass .place.p1{background:#FFC400;color:#111}.glass .place.p2{background:#8E979F;color:#fff}.glass .place.p3{background:#C0651F;color:#fff}
.glass table.tri th.sg,.glass table.tri td.sg{min-width:0;padding-left:.45em;padding-right:.45em;border-left:3px solid rgba(17,17,17,.6)}
.glass table.tri td.sg{font-family:Oswald,sans-serif;font-weight:700;font-size:1.15em}
.glass table.tri td.sg:nth-of-type(3){color:#0B4FC4}.glass table.tri td.sg:nth-of-type(4){color:#C81E12}.glass table.tri td.sg:nth-of-type(5){color:#111}
.glass table.tri td.sg.cur{background:rgba(255,212,0,.38)}
.glass table.tri th.tt{background:#111;color:#FFD400;border-left:4px solid #111}
.glass table.tri td.tt{background:#FFD400;color:#111;border-left:4px solid #111;font-weight:900;font-size:1.4em;padding-left:.4em;padding-right:.4em}
.glass table.tri td.xx,.glass table.tri th.xx{border-left:3px solid rgba(17,17,17,.6);font-weight:800}
.glass td.score{font-weight:900;font-size:1.45em}
.glass td.r{font-weight:700}
.glass .ends{font-size:.6em}
.glass .ends .lab{font-weight:800;color:#111}
.glass .ebox{border:2px solid rgba(17,17,17,.45);background:#fff}
.glass .ebox b{font-weight:700;font-size:1.25em;color:#111}.glass .ebox i{font-weight:700;color:#0B4FC4;font-size:.85em}
.glass .ebox.now{border-color:#C81E12;background:#FFF3B0}
.glass .ebox.todo{opacity:.45}
.glass .tie{color:#C81E12;border-color:#C81E12;font-weight:800}
.glass h1{font-weight:700}.glass .live{color:#111;font-weight:800}.glass .dot{background:#18A558;width:16px;height:16px}
.fading .wrap{opacity:0}
.demo{display:inline-block;margin-left:10px;padding:2px 10px;border-radius:999px;font-size:.5em;vertical-align:middle;border:1px solid var(--warn);color:var(--warn);font-family:Inter,sans-serif;letter-spacing:0}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="wrap">
  <div class="brand" id="brand" hidden></div>
  <header>
    <div><h1 id="title">Live leaderboard</h1><div class="sub" id="sub"></div></div>
    <div class="live" id="live" aria-live="polite"></div>
  </header>
  <main id="board"><div class="msg">Loading scores…</div></main>
  <footer><span>Scored live with Anchored In Archery</span><span id="updated"></span></footer>
</div>
<script>
// The public leaderboard for a tournament run in the Anchored In Archery app. Address: ?t=<tournament address>; add &tv=1 for a TV.
const SUPABASE_URL = "https://lkcvgpbqnutvpdfmitfn.supabase.co";
const PUBLIC_KEY = "sb_publishable_GoO0wO3k4yjTuKeR1Mvxcg_wL5hIDeJ"; // the publishable key: read-only, safe in a browser
const q = new URLSearchParams(location.search), tv = q.get("tv") === "1";
let slug = (q.get("t") || "").toLowerCase().trim();
// ?host=shoppe: always show that host's current tournament (the short TV address /shoppe uses this).
const host = (q.get("host") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
if (tv) document.body.classList.add("tv");
// Host branding: &brand=shoppe, or automatic when the tournament address mentions the shop or the Trifecta.
const BRANDS = {
  shoppe: [{ src: "brand/archery-shoppe.png", alt: "Archery Shoppe" }, { src: "brand/trifecta-challenge.png", alt: "Trifecta Challenge", wide: true }],
};
const brandKey = (q.get("brand") || (/trifecta|shoppe/.test(slug + " " + host) ? "shoppe" : "")).toLowerCase();
if (BRANDS[brandKey]) {
  const b = document.getElementById("brand");
  b.innerHTML = BRANDS[brandKey].map((l) => `<img src="${l.src}" alt="${l.alt}"${l.wide ? ' class="wide"' : ""}>`).join("");
  b.hidden = false;
  if (tv && q.get("glass") !== "0") { // logos behind the board; &glass=0 puts the plain logo bar back
    document.getElementById("backdrop").innerHTML = b.innerHTML;
    document.documentElement.dataset.theme = "light"; document.body.classList.add("glass");
  }
}
// ?t=demo shows sample scores so the screen can be checked before a shoot.
function demoData() {
  const names = { "Freestyle": ["Alex R.", "Jamie L.", "Chris M.", "Taylor B.", "Morgan D.", "Casey H."], "Bowhunter": ["Mark R.", "Lisa K.", "Dan W.", "Amy S."], "Barebow / Traditional": ["Joe T.", "Rita F.", "Sam B."], "Youth": ["Maya T.", "Jordan P.", "Ava L."] };
  const ends = 10, step = Math.floor(Date.now() / 10000) % ends + 1; let seed = 3;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const archers = []; let bale = 1;
  for (const [div, list] of Object.entries(names)) list.forEach((name, i) => {
    let total = 0, x = 0; const skill = 0.97 - i * 0.025 - (div === "Youth" ? 0.06 : 0);
    for (let e = 0; e < step; e++) for (let a = 0; a < 3; a++) { const r = rnd(); const s = r < skill * 0.55 ? 11 : r < skill ? 10 : 9; total += s; if (s === 11) x++; }
    archers.push({ name, division: div, class: "", bale: Math.ceil(bale / 4), pos: "ABCD"[(bale - 1) % 4], total, x, ends_shot: step }); bale++;
  });
  return { ok: true, updated_at: new Date().toISOString(), archers,
    tournament: { name: "Thursday League · Test", event_date: new Date().toISOString().slice(0, 10), ends, per_end: 3, status: "live", divisions: Object.keys(names) } };
}
// ?t=trifecta-demo: sample Trifecta Challenge. The Five and Vegas are finished, the Trifecta face is being shot end by end.
function trifectaDemo() {
  const SEG = [{ name: "The Five", ends: 12, per: 5, max: 6 }, { name: "Vegas", ends: 10, per: 3, max: 11 }, { name: "Trifecta", ends: 10, per: 4, max: 12 }];
  const names = { "Open Money Class": ["Alex R.", "Jamie L.", "Chris M.", "Taylor B.", "Morgan D.", "Casey H."], "Amateur": ["Mark R.", "Lisa K.", "Dan W.", "Amy S.", "Joe T.", "Rita F."], "Women's Open": ["Maya T.", "Jordan P.", "Ava L.", "Sam B."], "Youth": ["Eli K.", "Nora V.", "Ben C.", "Zoe M."] };
  const tick = Math.floor(Date.now() / 10000) % 14; let seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const archers = []; let n = 0;
  for (const [div, list] of Object.entries(names)) list.forEach((name, i) => {
    const skill = 0.96 - i * 0.03 - (div === "Amateur" ? 0.05 : div === "Youth" ? 0.09 : div === "Women's Open" ? 0.02 : 0), bale = Math.floor(n / 4) + 1;
    const full = SEG.map((g) => Array.from({ length: g.ends }, () => { let t = 0, x = 0; for (let a = 0; a < g.per; a++) { const r = rnd(); const v = r < skill * 0.5 ? g.max : r < skill ? g.max - 1 : g.max - 2; t += v; if (v === g.max) x++; } return [t, x]; }));
    const shot3 = Math.max(0, Math.min(10, tick + 1 - (bale % 2 === 0 && tick % 2 === 0 && tick < 10 ? 1 : 0)));
    const segs = SEG.map((g, k) => { const e = full[k].slice(0, k < 2 ? g.ends : shot3); return { name: g.name, of: g.ends, ends: e.map((v) => v[0]), x: e.reduce((s, v) => s + v[1], 0) }; });
    archers.push({ name, division: div, class: "", bale, pos: "ABCD"[n % 4], segs, ends: segs[2].ends,
      total: segs.reduce((s, g) => s + g.ends.reduce((a, b) => a + b, 0), 0), x: segs.reduce((s, g) => s + g.x, 0), ends_shot: 22 + shot3 }); n++;
  });
  return { ok: true, updated_at: new Date().toISOString(), archers,
    tournament: { name: "Trifecta Challenge", event_date: new Date().toISOString().slice(0, 10), ends: 32, per_end: 0, status: tick >= 10 ? "final" : "live", divisions: Object.keys(names), segs: SEG.map((g) => g.name), sub: "The Five · Vegas · Trifecta face" } };
}
// End-by-end boxes: each end's score on top, the running total under it.
function endStrip(ends, of, label) {
  let run = 0; const out = [];
  for (let i = 0; i < Math.max(of, ends.length); i++) {
    if (i < ends.length) { run += ends[i]; out.push(`<span class="ebox${i === ends.length - 1 && ends.length < of ? " now" : ""}"><b>${ends[i]}</b><i>${run}</i></span>`); }
    else out.push(`<span class="ebox todo"><b>${i + 1}</b><i>&nbsp;</i></span>`);
  }
  return `<div class="ends">${label ? `<span class="lab">${esc(label)}</span>` : ""}${out.join("")}</div>`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const group = (a) => [a.division, a.class].filter(Boolean).join(" · ") || "Open";
function rank(list) {
  const s = list.slice().sort((a, b) => b.total - a.total || b.x - a.x || String(a.name).localeCompare(String(b.name)));
  let place = 0;
  return s.map((a, i) => {
    const p = s[i - 1];
    if (!p || p.total !== a.total || p.x !== a.x) place = i + 1;
    return { ...a, place, tie: a.total > 0 && s.some((b, j) => j !== i && b.total === a.total && b.x === a.x) };
  });
}
function draw(d) {
  const t = d.tournament, $ = (id) => document.getElementById(id);
  document.title = `${t.name} · Live leaderboard`;
  $("title").textContent = t.name;
  $("sub").textContent = [t.event_date ? new Date(t.event_date + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : "", t.sub || `${t.ends} ends × ${t.per_end} arrows`].filter(Boolean).join(" · ");
  const final = t.status === "final";
  $("live").className = "live" + (final ? " final" : "");
  $("live").innerHTML = `<span class="dot" aria-hidden="true"></span>${final ? "Final results" : "Live"}`;
  const groups = {};
  d.archers.forEach((a) => (groups[group(a)] = groups[group(a)] || []).push(a));
  const order = (t.divisions || []).map((x) => x.toLowerCase());
  const names = Object.keys(groups).sort((a, b) => {
    const ia = order.indexOf(a.toLowerCase()), ib = order.indexOf(b.toLowerCase());
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  // Each end under the archer: on for small fields, &ends=1 forces it on, &ends=0 turns it off.
  const showEnds = q.get("ends") !== "0";
  const segs = t.segs || null;
  if (segs) { $("board").innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr))">${names.map((g) => {
    const rows = rank(groups[g]);
    return `<section class="div"><h2>${esc(g)}</h2><table class="tri"><thead><tr><th>#</th><th>Archer</th>${segs.map((n) => `<th class="sg">${esc(n)}</th>`).join("")}<th class="tt">Total</th><th class="xx">X</th></tr></thead><tbody>${rows.map((r) => {
      const cur = Math.max(0, r.segs.findIndex((x) => x.ends.length < x.of)), ci = r.segs.every((x) => x.ends.length >= x.of) ? r.segs.length - 1 : cur, c = r.segs[ci];
      return `<tr class="mr"><td><span class="place ${r.place <= 3 && r.total > 0 ? "p" + r.place : ""}">${r.place}</span></td><td><span class="name">${esc(r.name)}</span>${r.tie ? `<span class="tie">tied</span>` : ""}${r.bale ? `<span class="meta">Bale ${esc(r.bale)}${esc(r.pos || "")}</span>` : ""}</td>${r.segs.map((x, k) => `<td class="sg seg${k === ci && x.ends.length < x.of ? " cur" : ""}">${x.ends.length ? x.ends.reduce((a, b) => a + b, 0) : "–"}</td>`).join("")}<td class="tt score">${r.total}</td><td class="xx">${r.x}</td></tr>${showEnds ? `<tr class="er"><td></td><td colspan="${r.segs.length + 3}">${endStrip(c.ends, c.of, `${c.name} ${Math.min(c.ends.length, c.of)}/${c.of}`)}</td></tr>` : ""}`; }).join("")}</tbody></table></section>`;
  }).join("")}</div>`; }
  else $("board").innerHTML = names.length ? `<div class="grid">${names.map((g) => {
    const rows = rank(groups[g]);
    return `<section class="div"><h2>${esc(g)}</h2><table><thead><tr><th>#</th><th>Archer</th><th class="r">Score</th><th class="r">X</th><th class="r">Ends</th></tr></thead><tbody>${rows.map((r) =>
      `<tr><td><span class="place ${r.place <= 3 && r.total > 0 ? "p" + r.place : ""}">${r.place}</span></td><td><span class="name">${esc(r.name)}</span>${r.tie ? `<span class="tie">tied</span>` : ""}${r.bale ? `<div class="meta">Bale ${esc(r.bale)}${esc(r.pos || "")}</div>` : ""}</td><td class="r score">${r.total}</td><td class="r">${r.x}</td><td class="r">${r.ends_shot}/${t.ends}</td></tr>${showEnds && Array.isArray(r.ends) && r.ends.length ? `<tr class="er"><td></td><td colspan="4">${endStrip(r.ends, t.ends, "")}</td></tr>` : ""}`).join("")}</tbody></table></section>`;
  }).join("")}</div>` : `<div class="msg">No archers yet.</div>`;
  $("updated").textContent = d.updated_at ? `Last score ${new Date(d.updated_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : "";
}
async function load() {
  if (slug === "trifecta-demo") { draw(trifectaDemo()); document.getElementById("title").insertAdjacentHTML("beforeend", '<span class="demo">Sample scores</span>'); return; }
  if (slug === "demo") { draw(demoData()); document.getElementById("title").insertAdjacentHTML("beforeend", '<span class="demo">Sample scores</span>'); return; }
  if (host) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/t_latest`, { method: "POST", headers: { apikey: PUBLIC_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_prefix: host }) });
      const found = await r.json();
      slug = typeof found === "string" ? found : "";
    } catch (e) { document.getElementById("live").textContent = "Reconnecting…"; return; }
    if (!slug) {
      document.getElementById("title").textContent = "Live leaderboard";
      document.getElementById("sub").textContent = "";
      document.getElementById("live").textContent = "";
      document.getElementById("board").innerHTML = `<div class="msg">No tournament is scoring right now. Leave this screen on: it switches over by itself when the director opens scoring.</div>`;
      return;
    }
  }
  if (!slug) { document.getElementById("board").innerHTML = `<div class="msg">Open this page from the tournament's link (it ends in ?t=…).</div>`; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/t_board`, {
      method: "POST",
      headers: { apikey: PUBLIC_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_slug: slug }),
    });
    const d = await r.json();
    if (d && d.ok) draw(d);
    else document.getElementById("board").innerHTML = `<div class="msg">This leaderboard isn't up yet. It appears when the director opens scoring.</div>`;
  } catch (e) {
    document.getElementById("live").textContent = "Reconnecting…";
  }
}
load();
setInterval(load, 10000);
// On a TV the board scrolls by itself when it is taller than the screen: down slowly, a pause, then back to the top. &scroll=0 turns it off.
if (tv && q.get("scroll") !== "0") {
  let wait = 5, last = performance.now(), pos = 0;
  const SPEED = Math.max(5, Math.min(200, +q.get("speed") || 28)); // pixels a second; &speed=20 to try another pace
  const stepScroll = (now) => {
    const dt = Math.min(100, now - last) / 1000; last = now;
    const max = document.documentElement.scrollHeight - innerHeight;
    if (max > 20) {
      if (wait > 0) wait -= dt;
      else if (pos >= max) { // at the bottom: fade out, start again from the top, fade in
        wait = 6; document.body.classList.add("fading");
        setTimeout(() => { pos = 0; scrollTo(0, 0); document.body.classList.remove("fading"); }, 550);
      } else { pos = Math.min(max, pos + SPEED * dt); scrollTo(0, pos); if (pos >= max) wait = 5; }
    } else pos = 0;
    requestAnimationFrame(stepScroll);
  };
  requestAnimationFrame(stepScroll);
}
</script>
